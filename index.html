<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" id="theme-color" content="#F6F6F9">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Walking Football">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Taça Nacional Walking Football</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Taça Nacional de Walking Football 2026/27: zonas, clubes, jogos e cidades de cada jornada.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600&display=swap">
<script>(function () { var t = "light"; try { if (localStorage.getItem("taca-wf-theme") === "dark") t = "dark"; } catch (e) {} document.documentElement.setAttribute("data-theme", t); })();</script>
<style>
/* Layout: zone picker, then fixture-list reading. Big condensed numerals (positions, match days) in a left column, names and opponents to the right, hairline rules instead of cards. */
:root {
  --bg: #F6F6F9;
  --surface: #FFFFFF;
  --ink: #16171D;
  --muted: #5D6070;
  --line: #E1E2EA;
  --accent: #0B7F6C;
  --accent-ink: #FFFFFF;
  --accent-soft: #DDF3EE;
  --pink: #D1006F;
  --blue: #0079B4;
  --warm: #B85F00;
  --c-pink: #E50C7D;
  --c-blue: #00A0E3;
  --c-teal: #14AD96;
  --c-orange: #F29400;
  --z1-bg: #00AEEF; --z1-ink: #04222F; --z1-text: #0077A8;
  --z2-bg: #14506B; --z2-ink: #FFFFFF; --z2-text: #14506B;
  --z3-bg: #F4A582; --z3-ink: #3A1708; --z3-text: #B5502A;
  --z4-bg: #38761D; --z4-ink: #FFFFFF; --z4-text: #2F6A17;
  --z5-bg: #D96FD0; --z5-ink: #2E0B2B; --z5-text: #A32D96;
  --zc: var(--c-pink);
  --zc-text: var(--pink);
  --zc-ink: #FFFFFF;
  --font-display: "Barlow Condensed", "Arial Narrow", Arial, sans-serif;
  --font-body: "Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12111A;
    --surface: #1B1A26;
    --ink: #F1F1F6;
    --muted: #A3A5B8;
    --line: #2D2C3C;
    --accent: #3CCDB3;
    --accent-ink: #07211C;
    --accent-soft: #153A35;
    --pink: #FF5BAE;
    --blue: #4DBBF0;
    --warm: #FFAE3D;
    --z1-text: #4CC6F5;
    --z2-bg: #1E6C8F; --z2-text: #6CC3E8;
    --z3-text: #F4A582;
    --z4-text: #86D463;
    --z5-text: #E78CDE;
      color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12111A;
  --surface: #1B1A26;
  --ink: #F1F1F6;
  --muted: #A3A5B8;
  --line: #2D2C3C;
  --accent: #3CCDB3;
  --accent-ink: #07211C;
  --accent-soft: #153A35;
  --pink: #FF5BAE;
  --blue: #4DBBF0;
  --warm: #FFAE3D;
  --z1-text: #4CC6F5;
  --z2-bg: #1E6C8F; --z2-text: #6CC3E8;
  --z3-text: #F4A582;
  --z4-text: #86D463;
  --z5-text: #E78CDE;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.4;
  padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 680px; margin: 0 auto; min-width: 0; }
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

header.top { display: grid; gap: 6px; padding-bottom: 14px; }
.eyebrow {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 15px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--zc-text);
}
h1 {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(34px, 9vw, 46px);
  line-height: 0.95;
  text-transform: uppercase;
  letter-spacing: 0.01em;
  margin: 0;
  text-wrap: balance;
}
nav.tabs { display: flex; gap: 22px; border-bottom: 1px solid var(--line); margin-top: 6px; }
nav.tabs a {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 20px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  text-decoration: none;
  color: var(--muted);
  padding: 10px 0 8px;
  border-bottom: 3px solid transparent;
  margin-bottom: -1px;
}
nav.tabs a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--zc); }

.note { color: var(--muted); font-size: 14px; margin: 12px 0 0; min-height: 1.4em; }
.note.err { color: var(--warm); }

/* Header with poster */
.stripes { display: flex; gap: 5px; height: 10px; overflow: hidden; margin: 0 0 16px; }
.stripes i { flex: 1; transform: skewX(-40deg); }
.stripes i:nth-child(1) { background: var(--c-pink); }
.stripes i:nth-child(2) { background: var(--c-blue); }
.stripes i:nth-child(3) { background: var(--c-teal); }
.stripes i:nth-child(4) { background: var(--c-orange); }
.masthead { display: grid; grid-template-columns: minmax(0, 1fr) 128px; gap: 16px; align-items: start; }
.poster-btn { display: block; padding: 0; border: 0; background: none; cursor: zoom-in; border-radius: 4px; }
.poster-btn img { display: block; width: 100%; height: auto; border-radius: 4px; box-shadow: 0 1px 0 var(--line), 0 6px 18px rgba(20, 20, 40, 0.18); }
.poster-cap { font-size: 12px; color: var(--muted); margin-top: 6px; line-height: 1.3; }
.lightbox { position: fixed; inset: 0; z-index: 50; display: none; place-items: center; background: rgba(10, 10, 20, 0.86); padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); cursor: zoom-out; }
.lightbox.open { display: grid; }
.lightbox img { max-width: 100%; max-height: 100%; width: auto; height: auto; border-radius: 4px; }
@media (max-width: 420px) { .masthead { grid-template-columns: minmax(0, 1fr) 96px; gap: 12px; } }

/* Zones: each zone page takes its colour from the draw table */
.zone-1 { --zc: var(--z1-bg); --zc-text: var(--z1-text); --zc-ink: var(--z1-ink); }
.zone-2 { --zc: var(--z2-bg); --zc-text: var(--z2-text); --zc-ink: var(--z2-ink); }
.zone-3 { --zc: var(--z3-bg); --zc-text: var(--z3-text); --zc-ink: var(--z3-ink); }
.zone-4 { --zc: var(--z4-bg); --zc-text: var(--z4-text); --zc-ink: var(--z4-ink); }
.zone-5 { --zc: var(--z5-bg); --zc-text: var(--z5-text); --zc-ink: var(--z5-ink); }
body[class^="zone-"] { --accent: var(--zc-text); --accent-soft: color-mix(in srgb, var(--zc) 16%, var(--surface)); }
.lead { margin: 14px 0 12px; color: var(--muted); max-width: 52ch; }
ol.zones { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.zcard { display: grid; grid-template-columns: 56px minmax(0, 1fr) 20px; gap: 14px; align-items: center; padding: 14px 16px; background: var(--zc); color: var(--zc-ink); text-decoration: none; border-radius: 3px; }
.zcard:hover { filter: brightness(1.05); }
.zcard .znum { font-family: var(--font-display); font-weight: 700; font-size: 64px; line-height: 0.85; text-align: center; font-variant-numeric: tabular-nums; }
.zcard .chev { color: inherit; }
.zbody { display: grid; gap: 2px; min-width: 0; }
.zlabel { font-family: var(--font-display); font-weight: 700; font-size: 24px; letter-spacing: 0.06em; text-transform: uppercase; line-height: 1; }
.zadr { font-size: 15px; font-weight: 600; overflow-wrap: anywhere; }
.zmeta { font-size: 13px; opacity: 0.88; }
.zbanner { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 16px; align-items: center; background: var(--zc); color: var(--zc-ink); padding: 14px 30px 14px 18px; margin-top: 4px; clip-path: polygon(0 0, 100% 0, calc(100% - 18px) 100%, 0 100%); }
.zbanner .znum { font-family: var(--font-display); font-weight: 700; font-size: 76px; line-height: 0.82; font-variant-numeric: tabular-nums; }
.zbanner > div { min-width: 0; display: grid; gap: 2px; }
nav.tabs { margin-top: 10px; }
.pending-note { margin-top: 16px; padding: 14px 16px; border-left: 4px solid var(--zc); background: var(--accent-soft); border-radius: 0 3px 3px 0; max-width: 60ch; }

/* Logos, game meta */
.themebar { display: flex; justify-content: flex-end; margin: 0 0 10px; }
.seg { font: inherit; font-size: 13px; padding: 5px 12px; background: transparent; color: var(--muted); border: 1px solid var(--line); cursor: pointer; }
.seg:first-child { border-radius: 6px 0 0 6px; }
.seg:last-child { border-radius: 0 6px 6px 0; border-left: 0; }
.seg[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); font-weight: 600; }
.when .day.two { font-size: 30px; line-height: 1; }
.fix { grid-template-columns: 86px minmax(0, 1fr); }
.when .hrl { font-size: 11px; letter-spacing: 0.04em; color: var(--muted); margin-top: 6px; }
.when .hr { margin-top: 0; }
.resline { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin-top: 4px; }
.resval { font-size: 15px; }
.resval b { font-family: var(--font-display); font-size: 20px; letter-spacing: 0.04em; font-variant-numeric: tabular-nums; color: var(--zc-text); }
form.res input { flex: 0 0 56px; min-width: 0; width: 56px; text-align: center; font-size: 18px; font-variant-numeric: tabular-nums; }
form.res .dash { font-weight: 700; color: var(--muted); }
.resbadge { margin-left: auto; font-family: var(--font-display); font-weight: 700; color: var(--zc-text); font-variant-numeric: tabular-nums; }
@media (max-width: 380px) { .fix { grid-template-columns: 76px minmax(0, 1fr); } }

.adrtag { font-size: 12px; letter-spacing: 0.04em; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; }
.adrtag.prov { color: var(--warm); border-color: var(--warm); }
.when .hr { font-family: var(--font-display); font-weight: 600; font-size: 17px; color: var(--zc-text); margin-top: 2px; font-variant-numeric: tabular-nums; }

.logo { display: inline-grid; place-items: center; flex: none; background: #FFFFFF; border-radius: 6px; box-shadow: 0 0 0 1px var(--line); }
.logo img { display: block; width: 100%; height: 100%; object-fit: contain; padding: 2px; }
.logo.sm { width: 26px; height: 26px; }
.logo.md { width: 38px; height: 38px; }
.logo.lg { width: 56px; height: 56px; }
.gm { min-width: 0; display: grid; gap: 2px; }
.gmeta { display: flex; flex-wrap: wrap; gap: 0 10px; font-size: 14px; color: var(--muted); }
.gmeta .pair { font-family: var(--font-display); font-weight: 600; letter-spacing: 0.04em; font-size: 15px; }
.when2 { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--zc-text); }
ul.matches .when2 { font-size: 13px; min-width: 64px; }

/* Clubs list */
ol.clubs { list-style: none; margin: 4px 0 0; padding: 0; }
ol.clubs li { border-bottom: 1px solid var(--line); }
ol.clubs a {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 9px 0;
  text-decoration: none;
}
ol.clubs .posnum { width: 54px; flex: none; }
ol.clubs .cname { flex: 1; min-width: 0; }
ol.clubs .chev { margin-left: auto; }
.posnum {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 34px;
  line-height: 1;
  color: var(--zc-text);
  font-variant-numeric: tabular-nums;
}
.posnum small { font-size: 17px; font-weight: 600; margin-right: 2px; color: var(--muted); }
.cname { font-size: 18px; font-weight: 600; overflow-wrap: anywhere; }
.chev { color: var(--muted); }
ol.clubs a:hover .cname { text-decoration: underline; text-underline-offset: 3px; }

/* Team header */
.back { display: inline-flex; align-items: center; gap: 4px; color: var(--muted); text-decoration: none; font-size: 15px; padding: 14px 0 6px; }
.back:hover { color: var(--ink); }
.teamhead { display: flex; gap: 14px; align-items: flex-end; padding: 4px 0 14px; border-bottom: 3px solid var(--zc); }
.teamhead .posnum { font-size: 64px; }
.teamhead .posnum small { font-size: 28px; }
h2.tname {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(28px, 8vw, 38px);
  line-height: 1;
  margin: 0;
  overflow-wrap: anywhere;
  text-wrap: balance;
}
.tsub { color: var(--muted); font-size: 14px; margin-top: 4px; }

/* Fixture blocks */
.fix { display: grid; grid-template-columns: 86px minmax(0, 1fr); gap: 12px; padding: 16px 0; border-bottom: 1px solid var(--line); }
.when { display: grid; align-content: start; justify-items: start; gap: 2px; }
.when .day { font-family: var(--font-display); font-weight: 700; font-size: 40px; line-height: 0.9; font-variant-numeric: tabular-nums; }
.when .mon { font-family: var(--font-display); font-weight: 600; font-size: 15px; letter-spacing: 0.1em; color: var(--zc-text); }
.when .wd { font-size: 12px; color: var(--muted); }
.what { min-width: 0; display: grid; gap: 4px; }
.cityline { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; min-height: 30px; }
.cityline .label { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.cityline .cityname { font-weight: 600; font-size: 17px; }
.cityline .pending { color: var(--muted); font-style: italic; }
.jr { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }

.game { display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: 10px; align-items: baseline; padding: 7px 0; border-top: 1px dashed var(--line); }
.game:first-of-type { border-top: 0; }
.slot { font-family: var(--font-display); font-weight: 600; font-size: 15px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.slot.extra { color: var(--warm); }
a.opp { display: inline-flex; flex-wrap: wrap; gap: 2px 8px; align-items: center; text-decoration: none; min-width: 0; }
a.opp .p { font-family: var(--font-display); font-weight: 700; font-size: 17px; color: var(--zc-text); }
a.opp .n { font-weight: 600; font-size: 17px; overflow-wrap: anywhere; }
a.opp:hover .n { text-decoration: underline; text-underline-offset: 3px; }
.rest { color: var(--muted); font-style: italic; }

/* Edit controls */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  min-height: 34px; padding: 4px 12px;
  background: transparent; border: 1px solid var(--line); border-radius: 6px;
  font-size: 14px; cursor: pointer;
}
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.primary:hover { color: var(--accent-ink); filter: brightness(1.06); }
.iconbtn { min-width: 34px; padding: 4px 8px; }
form.inline { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; width: 100%; }
form.inline input {
  flex: 1 1 180px; min-width: 0; min-height: 40px;
  font: inherit; font-size: 16px; color: var(--ink);
  background: var(--surface); border: 1px solid var(--accent); border-radius: 6px; padding: 6px 10px;
}

.printbar { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 0 0; }
.btn.gps { text-decoration: none; color: var(--accent); border-color: var(--accent); }
.btn.gps:hover { background: var(--accent-soft); }

/* Calendar tab */
details.all { margin-top: 6px; }
details.all summary { cursor: pointer; color: var(--accent); font-size: 14px; font-weight: 600; padding: 6px 0; }
details.all h4 { font-family: var(--font-display); font-weight: 600; font-size: 15px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 10px 0 4px; }
ul.matches { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
ul.matches li { display: flex; flex-wrap: wrap; gap: 0 6px; align-items: baseline; font-size: 15px; padding: 3px 0; }
ul.matches .p { font-family: var(--font-display); font-weight: 700; color: var(--zc-text); }
ul.matches .x { color: var(--muted); }
ul.matches a { text-decoration: none; }
ul.matches a:hover { text-decoration: underline; }

@media (max-width: 380px) {
  .fix { grid-template-columns: 76px minmax(0, 1fr); gap: 10px; }
  .game { grid-template-columns: 80px minmax(0, 1fr); }
  ol.clubs .posnum { width: 48px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
.teamhead > div { min-width: 0; flex: 1; }
.teamhead .logo { align-self: center; }
html { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
</style>
</head>
<body>

<div class="wrap">
  <div class="themebar" role="group" aria-label="Fundo da página"><button type="button" class="seg" data-theme-set="light" aria-pressed="true">Fundo branco</button><button type="button" class="seg" data-theme-set="dark" aria-pressed="false">Fundo preto</button></div>
  <div class="stripes" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  <header class="top">
    <div class="masthead">
      <div>
        <div class="eyebrow">FPF Walking Football · Competitivo 2026/27</div>
        <h1>Taça Nacional Walking Football</h1>

  var editing = null;   /* {kind:"city"|"team", key:"3"} */
  var dl = null;

  var app = document.getElementById("app");
  var statusEl = document.getElementById("status");

  function emptyOver() { return { cities: {}, gps: {}, teams: {}, results: {} }; }
  function normalize(d) {
    return { cities: Object.assign({}, d && d.cities), gps: Object.assign({}, d && d.gps), teams: Object.assign({}, d && d.teams), results: Object.assign({}, d && d.results) };
  }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function teamName(p) { return over.teams[p] || Z.teams[p - 1]; }
  function hostAdr(d) { return Z.hosts[d][0] || ""; }
  function hostLocal(d) { return Z.hosts[d][1] || ""; }
  function timeOf(d) { return Z.times ? Z.times[d] : "14h00"; }
  function cityOf(d) { return over.cities[d] || hostLocal(d) || hostAdr(d); }
  function adrTag(d) {
    var a = hostAdr(d), c = cityOf(d), prov = Z.hosts[d][2] === "prov";
    var t = a ? '<span class="adrtag">ADR ' + esc(a) + '</span>' : '';
    return t + (prov ? '<span class="adrtag prov">Provisório</span>' : '');
  }
  function dparts(iso) {
    var a = iso.split("-").map(Number);
    return { y: a[0], m: a[1], d: a[2], wd: new Date(Date.UTC(a[0], a[1] - 1, a[2])).getUTCDay() };
  }
  function longDate(iso, span) {
    var p = dparts(iso);
    if (span === 2) {
      var q = dparts(new Date(Date.UTC(p.y, p.m - 1, p.d + 1)).toISOString().slice(0, 10));
      return WEEKDAYS[p.wd] + " e " + WEEKDAYS[q.wd].toLowerCase() + ", " + p.d + " e " + q.d + " de " + MONTHS_L[q.m - 1] + " de " + q.y;
    }
    return WEEKDAYS[p.wd] + ", " + p.d + " de " + MONTHS_L[p.m - 1] + " de " + p.y;
  }
  function spanOf(d) { return Z.span ? Z.span[d] : 1; }
  function shortDate(iso) {
    var p = dparts(iso);
    return p.d + " " + MONTHS[p.m - 1].toLowerCase() + " " + p.y;
  }

  function ico(path) {
    return '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + path + '</svg>';
  }
  var ICON_PIN = ico('<path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>');
  var ICON_NAV = ico('<path d="M3 11l18-8-8 18-2-8-8-2z"/>');
  var ICON_EDIT = ico('<path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16v4z"/>');
  var ICON_DL = ico('<path d="M12 4v11M7 11l5 5 5-5M5 20h14"/>');
  var ICON_CHEV = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>';
  var ICON_BACK = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>';

  /* ---------- routing: #  |  #zona-2  |  #zona-2-calendario  |  #zona-2-clube-7 ---------- */
  function route() {
    var m = /^#zona-([1-5])(?:-(calendario)|-clube-(\d+))?$/.exec(location.hash || "");
    if (!m) return { view: "home" };
    var zone = +m[1];
    if (m[2]) return { view: "calendario", zone: zone };
    if (m[3]) {
      var z = ZONES[zone - 1], n = +m[3];
      if (z.teams && n >= 1 && n <= z.teams.length) return { view: "clube", zone: zone, team: n };
    }
    return { view: "clubes", zone: zone };
  }
  function zhref(suffix) { return "#zona-" + Z.id + (suffix || ""); }

  /* ---------- pieces ---------- */
  function cityBlock(d) {
    if (editing && editing.kind === "city" && editing.key === String(d)) {
      return '<form class="inline" data-form="city" data-key="' + d + '">' +
        '<input id="edit-input" type="text" maxlength="60" autocomplete="off" placeholder="Cidade que acolhe" aria-label="Cidade que acolhe as jornadas" value="' + esc(cityOf(d)) + '">' +
        '<input id="edit-gps" type="text" maxlength="500" autocomplete="off" inputmode="url" placeholder="Link GPS (Google Maps, Waze...)" aria-label="Link GPS do pavilhão" value="' + esc(over.gps[d] || '') + '">' +
        '<button type="submit" class="btn primary">Guardar</button>' +
        '<button type="button" class="btn" data-action="cancel">Cancelar</button></form>';
    }
    var c = cityOf(d);
    var txt = c ? '<span class="cityname">' + esc(c) + '</span>' + adrTag(d) : '<span class="cityname pending">Cidade por definir</span>';
    var g = over.gps[d];
    var gpsLink = g ? '<a class="btn gps" href="' + esc(g) + '" target="_blank" rel="noopener noreferrer">' + ICON_NAV + '<span>GPS</span></a>' : '';
    var btn = canWrite ? '<button type="button" class="btn iconbtn" data-action="edit-city" data-key="' + d + '" aria-label="Editar cidade">' + ICON_EDIT + '<span>Editar</span></button>' : '';
    return '<span class="label">' + ICON_PIN + ' Cidade</span>' + txt + gpsLink + btn;
  }

  function dateCol(d) {
    var p = dparts(Z.dates[d]);
    var two = spanOf(d) === 2, q = two ? dparts(new Date(Date.UTC(p.y, p.m - 1, p.d + 1)).toISOString().slice(0, 10)) : p;
    var dd = function (n) { return n < 10 ? "0" + n : n; };
    return '<div class="when"><span class="day' + (two ? ' two' : '') + '">' + dd(p.d) + (two ? '–' + dd(q.d) : '') + '</span><span class="mon">' + MONTHS[q.m - 1] + ' ' + q.y + '</span><span class="wd">' + WEEKDAYS[p.wd] + (two ? ' e ' + WEEKDAYS[q.wd].toLowerCase() : '') + '</span><span class="hrl">Concentração</span><span class="hr">' + timeOf(d) + '</span></div>';
  }

  function find(list, t) {
    for (var i = 0; i < list.length; i++) if (list[i][0] === t || list[i][1] === t) return list[i];
    return null;
  }
  function opp(g, t) { return g[0] === t ? g[1] : g[0]; }
  function oppLink(o) {
    return '<a class="opp" href="' + zhref("-clube-" + o) + '">' + logo(o, 'sm') + '<span class="p">P' + o + '</span><span class="n">' + esc(teamName(o)) + '</span></a>';
  }
  function resKey(d, g) { return d + "_" + g[0] + "_" + g[1]; }
  function resPretty(r) { return r ? r.replace("-", " - ") : ""; }
  function resultBlock(d, g) {
    var rk = resKey(d, g);
    if (editing && editing.kind === "result" && editing.key === rk) {
      var cur = (over.results[rk] || "").split("-");
      return '<form class="inline res" data-form="result" data-key="' + rk + '">' +
        '<input id="res-h" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="2" autocomplete="off" aria-label="Golos de P' + g[0] + '" value="' + esc(cur[0] || "") + '">' +
        '<span class="dash">-</span>' +
        '<input id="res-a" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="2" autocomplete="off" aria-label="Golos de P' + g[1] + '" value="' + esc(cur[1] || "") + '">' +
        '<button type="submit" class="btn primary">Guardar</button><button type="button" class="btn" data-action="cancel">Cancelar</button></form>';
    }
    var r = over.results[rk];
    var shown = r ? '<span class="resval">Resultado <b>' + esc(resPretty(r)) + '</b></span>' : '';
    var btn = canWrite ? '<button type="button" class="btn iconbtn" data-action="edit-result" data-key="' + rk + '">' + ICON_EDIT + '<span>' + (r ? 'Editar' : 'Resultado') + '</span></button>' : '';
    return (shown || btn) ? '<div class="resline">' + shown + btn + '</div>' : '';
  }
  function gameCell(label, d, g, t) {
    if (!g) return '<span class="slot">' + label + '</span><span class="rest">Descansa</span>';
    var st = slotText(d, g);
    return '<span class="slot">' + label + '</span><div class="gm">' + oppLink(opp(g, t)) +
      '<div class="gmeta"><span class="pair">' + pairText(g) + '</span>' + (st ? '<span class="when2">' + esc(st) + '</span>' : '') + '</div>' + resultBlock(d, g) + '</div>';
  }
  function restsIn(list, t) { return !find(list, t); }
  function logo(p, cls) {
    var src = Z.logos && Z.logos[p - 1];
    return src ? '<span class="logo ' + (cls || '') + '"><img src="' + src + '" alt="" loading="lazy"></span>' : '';
  }
  function slotOf(d, g) {
    var m = Z.sched && Z.sched[d], v = m && m[g[0] + "-" + g[1]];
    return v ? { time: v[0], court: v[1] } : null;
  }
  function slotText(d, g, short) {
    var s = slotOf(d, g);
    return s ? s.time + " · " + (short ? "C" : "Campo ") + s.court : "";
  }
  /* jogos de uma jornada: os 7 da matriz + o J8, por ordem de horário quando existe */
  function roundGames(d, D, which) {
    var base = which === 1 ? D.r1 : D.r2;
    /* o J8 aparece uma só vez: na jornada em que descansa a primeira equipa do jogo */
    var j8Round = D.x ? (restsIn(D.r1, D.x[0]) ? 1 : 2) : 0;
    var list = which === j8Round ? base.concat([D.x]) : base.slice();
    function key(g) { var s = slotOf(d, g); return s ? parseInt(s.time, 10) * 10 + s.court : 9999; }
    return list.map(function (g, i) { return { g: g, k: key(g), i: i }; })
      .sort(function (a, b) { return a.k - b.k || a.i - b.i; })
      .map(function (o) { return o.g; });
  }
  function pairText(g) { return "(P" + g[0] + " X P" + g[1] + ")"; }
  function j8text(D) {
    var s = [];
    D.x.forEach(function (t) {
      if (restsIn(D.r1, t)) s.push("P" + t + " na 1.ª jornada");
      if (restsIn(D.r2, t)) s.push("P" + t + " na 2.ª jornada");
    });
    return "O J8 conta para a jornada em que a equipa descansa: " + s.join(" e ") + ".";
  }
  function pdfBar(action, key, label) {
    if (!dl) return '';
    return '<div class="printbar"><button type="button" class="btn" data-action="' + action + '" data-key="' + key + '">' + ICON_DL + '<span>' + label + '</span></button></div>';
  }

  function zoneHead(tab) {
    var adrs = Z.adrs.map(function (a) { return esc(a[0]); }).join(" · ");
    return '<a class="back" href="#">' + ICON_BACK + ' Zonas</a>' +
      '<div class="zbanner"><span class="znum">' + Z.id + '</span><div><div class="zlabel">Zona ' + Z.id + '</div><div class="zadr">' + adrs + '</div><div class="zmeta">' + Z.entities + ' entidades · ' + Z.dates.length + ' datas</div></div></div>' +
      '<nav class="tabs" aria-label="Secções da Zona ' + Z.id + '">' +
      '<a href="' + zhref("") + '"' + (tab === "clubes" ? ' aria-current="page"' : '') + '>Clubes</a>' +
      '<a href="' + zhref("-calendario") + '"' + (tab === "calendario" ? ' aria-current="page"' : '') + '>Calendário</a></nav>';
  }

  /* ---------- views ---------- */
  function viewHome() {
    var h = '<p class="lead">Escolhe a tua zona para ver os clubes, os jogos e as cidades de cada jornada.</p><ol class="zones">';
    ZONES.forEach(function (z) {
      var adrs = z.adrs.map(function (a) { return esc(a[0]); }).join(" · ");
      h += '<li><a class="zcard zone-' + z.id + '" href="#zona-' + z.id + '"><span class="znum">' + z.id + '</span>' +
        '<span class="zbody"><span class="zlabel">Zona ' + z.id + '</span><span class="zadr">' + adrs + '</span>' +
        '<span class="zmeta">' + z.entities + ' entidades · 1.ª data ' + shortDate(z.dates[0]) + (z.teams ? '' : ' · sorteio por publicar') + '</span></span>' +
        '<span class="chev">' + ICON_CHEV + '</span></a></li>';
    });
    return h + '</ol>';
  }

  function viewClubes() {
    var h = zoneHead("clubes");
    if (!Z.teams) {
      return h + '<div class="pending-note"><strong>Sorteio por publicar.</strong> Quando for divulgado, os clubes por posição e os jogos de cada equipa aparecem aqui. No Calendário já podes ver as datas e as cidades.</div>';
    }
    h += '<ol class="clubs">';
    for (var p = 1; p <= Z.teams.length; p++) {
      h += '<li><a href="' + zhref("-clube-" + p) + '"><span class="posnum"><small>P</small>' + p + '</span>' + logo(p, 'md') + '<span class="cname">' + esc(teamName(p)) + '</span><span class="chev">' + ICON_CHEV + '</span></a></li>';
    }
    return h + '</ol>';
  }

  function viewClube(t) {
    var nameHtml;
    if (editing && editing.kind === "team" && editing.key === String(t)) {
      nameHtml = '<form class="inline" data-form="team" data-key="' + t + '"><input id="edit-input" type="text" maxlength="60" autocomplete="off" aria-label="Nome do clube" value="' + esc(teamName(t)) + '"><button type="submit" class="btn primary">Guardar</button><button type="button" class="btn" data-action="cancel">Cancelar</button></form>';
    } else {
      nameHtml = '<h2 class="tname">' + esc(teamName(t)) + '</h2>';
    }
    var editName = (CAN_RENAME_TEAMS && canWrite && !(editing && editing.kind === "team")) ? '<div style="margin-top:8px"><button type="button" class="btn iconbtn" data-action="edit-team" data-key="' + t + '">' + ICON_EDIT + '<span>Editar nome</span></button></div>' : '';

    var h = '<a class="back" href="' + zhref("") + '">' + ICON_BACK + ' Zona ' + Z.id + ' · Clubes</a>' + pdfBar('pdf-team', t, 'Descarregar PDF desta equipa') +
      '<div class="teamhead"><span class="posnum"><small>P</small>' + t + '</span>' + logo(t, 'lg') + '<div>' + nameHtml + '<div class="tsub">Zona ' + Z.id + ' · ' + (2 * Z.dates.length) + ' jogos em ' + Z.dates.length + ' datas</div>' + editName + '</div></div>';

    for (var d = 0; d < Z.dates.length; d++) {
      var D = Z.matrix[d];
      var g1 = find(D.r1, t), g2 = find(D.r2, t), gx = (D.x && (D.x[0] === t || D.x[1] === t)) ? D.x : null;
      var a = g1 || gx, b = g2 || gx;
      var cell1 = gameCell((2 * d + 1) + '.ª Jorn.', d, a, t);
      var cell2 = gameCell((2 * d + 2) + '.ª Jorn.', d, b, t);
      h += '<section class="fix" aria-label="Jornadas ' + (2 * d + 1) + ' e ' + (2 * d + 2) + '">' + dateCol(d) +
        '<div class="what"><div class="cityline">' + cityBlock(d) + '</div><div class="jr">Jornadas ' + (2 * d + 1) + ' e ' + (2 * d + 2) + '</div>' +
        '<div class="game">' + cell1 + '</div><div class="game">' + cell2 + '</div></div></section>';
    }
    return h;
  }

  function matchLi(g, d) {
    var st = slotText(d, g, true);
    return '<li>' + (st ? '<span class="when2">' + esc(st) + '</span>' : '') + '<a href="' + zhref("-clube-" + g[0]) + '"><span class="p">P' + g[0] + '</span> ' + esc(teamName(g[0])) + '</a><span class="x">×</span><a href="' + zhref("-clube-" + g[1]) + '"><span class="p">P' + g[1] + '</span> ' + esc(teamName(g[1])) + '</a>' + (d !== undefined && over.results[resKey(d, g)] ? '<span class="resbadge">' + esc(resPretty(over.results[resKey(d, g)])) + '</span>' : '') + '</li>';
  }

  function viewCalendario() {
    var h = zoneHead("calendario") + pdfBar('pdf-all', '', 'Descarregar PDF do calendário completo');
    for (var d = 0; d < Z.dates.length; d++) {
      var D = Z.matrix && Z.matrix[d];
      h += '<section class="fix">' + dateCol(d) + '<div class="what"><div class="cityline">' + cityBlock(d) + '</div><div class="jr">Jornadas ' + (2 * d + 1) + ' e ' + (2 * d + 2) + '</div>';
      if (D) {
        h += '<details class="all"><summary>Ver os jogos</summary>' +
          '<h4>' + (2 * d + 1) + '.ª Jornada</h4><ul class="matches">' + roundGames(d, D, 1).map(function (g) { return matchLi(g, d); }).join('') + '</ul>' +
          '<h4>' + (2 * d + 2) + '.ª Jornada</h4><ul class="matches">' + roundGames(d, D, 2).map(function (g) { return matchLi(g, d); }).join('') + '</ul></details>';
      }
      h += '</div></section>';
    }
    return h;
  }

  function setStatus(msg, isErr) {
    statusEl.textContent = msg || "";
    statusEl.className = "note" + (isErr ? " err" : "");
  }
  function idleNote() {
    if (!Z) return "";
    if (mode === "shared" && canWrite) return "Podes editar a cidade e o link GPS de cada data. As alterações ficam guardadas para todos.";
    if (mode === "local") return "As alterações ficam guardadas apenas neste dispositivo.";
    return "";
  }

  function setZone(z) {
    Z = z;
    over = overs[z.id] || (overs[z.id] = emptyOver());
    editing = null;
    platformOpen(z.id);
  }
  function applyRemote(zid, data) {
    overs[zid] = normalize(data);
    if (Z && Z.id === zid) { over = overs[zid]; if (!editing) render(); }
  }

  function render() {
    var r = route();
    if (r.zone) { if (!Z || Z.id !== r.zone) setZone(ZONES[r.zone - 1]); }
    else Z = null;
    document.body.className = Z ? "zone-" + Z.id : "";
    if (r.view === "clube") app.innerHTML = viewClube(r.team);
    else if (r.view === "calendario") app.innerHTML = viewCalendario();
    else if (r.view === "clubes") app.innerHTML = viewClubes();
    else app.innerHTML = viewHome();
    if (!statusEl.classList.contains("err")) setStatus(idleNote());
    if (editing) {
      var inp = document.getElementById("edit-input") || document.getElementById("res-h");
      if (inp) { inp.focus(); inp.select(); }
    }
  }

  /* ---------- editing ---------- */
  function cleanUrl(u) {
    u = (u || "").trim();
    if (!u) return "";
    if (!/^https?:\/\//i.test(u)) u = "https://" + u;
    try { return new URL(u).href; } catch (e) { return ""; }
  }
  function saveResult(rk, h, a) {
    h = (h || "").replace(/\D/g, ""); a = (a || "").replace(/\D/g, "");
    var up = {};
    if (!h && !a) { delete over.results[rk]; up["results/" + rk] = null; }
    else if (!h || !a) { setStatus("Preenche os golos das duas equipas, ou deixa ambos vazios para apagar.", true); return; }
    else { over.results[rk] = (+h) + "-" + (+a); up["results/" + rk] = over.results[rk]; }
    editing = null;
    statusEl.className = "note";
    render();
    platformSave(Z.id, up);
  }
  function saveEdit(kind, key, value, gps) {
    value = value.replace(/\s+/g, " ").trim();
    var up = {};
    if (kind === "city") {
      if (value) over.cities[key] = value; else delete over.cities[key];
      var gu = cleanUrl(gps);
      if (gu) over.gps[key] = gu; else delete over.gps[key];
      up["cities/" + key] = value || null;
      up["gps/" + key] = gu || null;
    } else {
      if (value && value !== Z.teams[+key - 1]) over.teams[key] = value; else delete over.teams[key];
      up["teams/" + key] = over.teams[key] || null;
    }
    editing = null;
    statusEl.className = "note";
    render();
    platformSave(Z.id, up);
  }

  /* ---------- PDF ---------- */
  function slug(s) {
    return s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  }
  function buildPdf(team) {
    var J = window.jspdf && window.jspdf.jsPDF;
    if (!J) return null;
    var doc = new J({ unit: "mm", format: "a4" });
    var M = 16, W = 210 - 2 * M, y = M;
    var zc = Z.rgb;
    function put(str, size, bold, indent, gap, rgb) {
      doc.setFont("helvetica", bold ? "bold" : "normal");
      doc.setFontSize(size);
      var c = rgb || [20, 22, 29];
      doc.setTextColor(c[0], c[1], c[2]);
      var lines = doc.splitTextToSize(str, W - indent);
      var lh = size * 0.42;
      if (y + lines.length * lh > 297 - M) { doc.addPage(); y = M; }
      lines.forEach(function (ln) { y += lh; doc.text(ln, M + indent, y); });
      y += gap;
    }
    function rule() {
      doc.setDrawColor(190, 195, 205);
      doc.line(M, y, M + W, y);
      y += 4;
    }
    function dateHead(d) {
      var need = team ? 40 : (Z.matrix ? 100 : 30);
      if (y + need > 297 - M) { doc.addPage(); y = M; }
      put(longDate(Z.dates[d], spanOf(d)), 13, true, 0, 1.5, zc);
      var c = cityOf(d), a = hostAdr(d);
      put("Cidade: " + (c || "por definir") + (a ? "  (ADR " + a + ")" : "") + (Z.hosts[d][2] === "prov" ? "  · provisório" : ""), 11, true, 0, 1);
      put("Concentração: " + timeOf(d), 10, false, 0, 1, [93, 96, 112]);
      if (over.gps[d]) put("GPS: " + over.gps[d], 9, false, 0, 1.5, [93, 96, 112]);
    }
    function pdfGame(d, g, t) {
      if (!g) return "Descansa";
      var st = slotText(d, g);
      var r = over.results[resKey(d, g)];
      return "P" + opp(g, t) + " " + teamName(opp(g, t)) + "  " + pairText(g) + (st ? "  ·  " + st : "") + (r ? "  ·  Resultado " + resPretty(r) : "");
    }
    function game(g) { return "P" + g[0] + " " + teamName(g[0]) + "  x  P" + g[1] + " " + teamName(g[1]); }

    put("Taça Nacional Walking Football · Zona " + Z.id, 11, false, 0, 1, zc);
    if (team) {
      put("P" + team + " " + teamName(team), 22, true, 0, 1);
      put("Zona " + Z.id + " · " + (2 * Z.dates.length) + " jogos em " + Z.dates.length + " datas", 10, false, 0, 6, [93, 96, 112]);
    } else {
      put("Calendário da Zona " + Z.id, 22, true, 0, 6);
    }
    rule();
    for (var d = 0; d < Z.dates.length; d++) {
      dateHead(d);
      var D = Z.matrix && Z.matrix[d];
      if (team) {
        var g1 = find(D.r1, team), g2 = find(D.r2, team), gx = (D.x && (D.x[0] === team || D.x[1] === team)) ? D.x : null;
        var a = g1 || gx, b = g2 || gx;
        put((2 * d + 1) + ".ª Jornada:  " + pdfGame(d, a, team), 11, false, 4, 1);
        put((2 * d + 2) + ".ª Jornada:  " + pdfGame(d, b, team), 11, false, 4, 3);
      } else if (D) {
        put((2 * d + 1) + ".ª Jornada", 10, true, 2, 0.5, [93, 96, 112]);
        roundGames(d, D, 1).forEach(function (g) { put(game(g) + (slotText(d, g, true) ? "   " + slotText(d, g, true) : ""), 10, false, 6, 0.3); });
        put((2 * d + 2) + ".ª Jornada", 10, true, 2, 0.5, [93, 96, 112]);
        roundGames(d, D, 2).forEach(function (g) { put(game(g) + (slotText(d, g, true) ? "   " + slotText(d, g, true) : ""), 10, false, 6, 0.3); });
        y += 2.5;
      } else {
        y += 2;
      }
      if (d < Z.dates.length - 1) rule();
    }
    return doc;
  }
  function exportPdf(team) {
    var doc = buildPdf(team);
    if (!doc) { setStatus("Não foi possível gerar o PDF.", true); return; }
    var name = team ? "taca-wf-zona" + Z.id + "-p" + team + "-" + slug(teamName(team)) + ".pdf" : "taca-wf-zona" + Z.id + "-calendario.pdf";
    dl.save({ filename: name, data: doc.output("arraybuffer") }).then(function () {
      statusEl.className = "note"; setStatus("PDF guardado.");
    }, function (err) {
      if (err && err.code === "declined") return;
      setStatus("Não foi possível guardar o PDF.", true);
    });
  }

    /* ---------- plataforma: site público (Firebase Realtime Database via REST) ---------- */
  var timer = null, chain = Promise.resolve();
  function download(o) {
    return new Promise(function (resolve, reject) {
      try {
        var url = URL.createObjectURL(new Blob([o.data], { type: "application/pdf" }));
        var a = document.createElement("a");
        a.href = url; a.download = o.filename;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
        resolve({ status: "saved" });
      } catch (e) { reject(e); }
    });
  }
  async function platformInit() {
    dl = { save: download };
    canWrite = true;
    if (!DB_URL) { mode = "local"; return; }
    DB_URL = DB_URL.trim().replace(/\.json$/i, "").replace(/\/+$/, "");
    if (!/^https?:\/\//i.test(DB_URL)) DB_URL = "https://" + DB_URL;
    mode = "shared";
  }
  function why(e) {
    var m = /http (\d+)/.exec(e && e.message || "");
    var c = m ? +m[1] : 0;
    if (c === 401 || c === 403) return " Erro " + c + ": a base de dados recusou o acesso. Volta a colar e publicar as regras (database.rules.json) no Firebase.";
    if (c === 404) return " Erro 404: o endereço da base de dados parece estar errado.";
    if (c) return " Erro " + c + ".";
    if (/console\.firebase|firebase\.google\.com/.test(DB_URL)) return " O endereço usado é o da consola do Firebase. Usa o endereço da Realtime Database (termina em firebasedatabase.app ou firebaseio.com).";
    return " Sem resposta do servidor. Confirma o endereço da base de dados e a ligação.";
  }
  function pull(zid) {
    return fetch(DB_URL + "/zona" + zid + ".json").then(function (r) {
      if (!r.ok) throw new Error("http " + r.status);
      return r.json();
    }).then(function (data) {
      var n = normalize(data);
      if (JSON.stringify(n) !== JSON.stringify(overs[zid] || emptyOver())) applyRemote(zid, data);
    });
  }
  function platformOpen(zid) {
    clearInterval(timer);
    if (mode === "local") {
      try {
        var raw = localStorage.getItem(KEY + zid);
        if (raw) overs[zid] = normalize(JSON.parse(raw));
        if (Z && Z.id === zid) over = overs[zid] || over;
      } catch (e) {}
      return;
    }
    if (mode !== "shared") return;
    pull(zid).catch(function (e) { setStatus("Não foi possível carregar as cidades guardadas." + why(e), true); });
    timer = setInterval(function () { if (!document.hidden) pull(zid).catch(function () {}); }, 20000);
  }
  function platformSave(zid, updates) {
    if (mode === "local") {
      try { localStorage.setItem(KEY + zid, JSON.stringify(overs[zid])); } catch (e) {}
      return;
    }
    chain = chain.then(function () {
      return fetch(DB_URL + "/zona" + zid + ".json", { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify(updates) });
    }).then(function (r) {
      if (!r.ok) throw new Error("http " + r.status);
      statusEl.className = "note"; setStatus(idleNote());
    }).catch(function (e) {
      setStatus("Não foi possível guardar." + why(e), true);
    });
  }


  /* ---------- events ---------- */
  app.addEventListener("click", function (e) {
    var b = e.target.closest("[data-action]");
    if (!b) return;
    var a = b.getAttribute("data-action");
    if (a === "pdf-team") { exportPdf(+b.getAttribute("data-key")); return; }
    if (a === "pdf-all") { exportPdf(0); return; }
    if (a === "edit-city") editing = { kind: "city", key: b.getAttribute("data-key") };
    else if (a === "edit-result") editing = { kind: "result", key: b.getAttribute("data-key") };
    else if (a === "edit-team") editing = { kind: "team", key: b.getAttribute("data-key") };
    else if (a === "cancel") editing = null;
    render();
  });
  app.addEventListener("submit", function (e) {
    var f = e.target.closest("form[data-form]");
    if (!f) return;
    e.preventDefault();
    if (f.getAttribute("data-form") === "result") { saveResult(f.getAttribute("data-key"), document.getElementById("res-h").value, document.getElementById("res-a").value); return; }
    var gi = document.getElementById("edit-gps");
    saveEdit(f.getAttribute("data-form"), f.getAttribute("data-key"), document.getElementById("edit-input").value, gi ? gi.value : "");
  });
  app.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && editing) { editing = null; render(); }
  });
  window.addEventListener("hashchange", function () {
    editing = null;
    statusEl.className = "note";
    render();
    window.scrollTo(0, 0);
  });

  /* fundo branco / preto, guardado neste dispositivo */
  function applyTheme(t, save) {
    document.documentElement.setAttribute("data-theme", t);
    var meta = document.getElementById("theme-color");
    if (meta) meta.setAttribute("content", t === "dark" ? "#12111A" : "#F6F6F9");
    var bs = document.querySelectorAll("[data-theme-set]");
    for (var i = 0; i < bs.length; i++) bs[i].setAttribute("aria-pressed", bs[i].getAttribute("data-theme-set") === t ? "true" : "false");
    if (save) { try { localStorage.setItem("taca-wf-theme", t); } catch (e) {} }
  }
  (function () {
    var cur = document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light";
    applyTheme(cur, false);
    var bs = document.querySelectorAll("[data-theme-set]");
    for (var i = 0; i < bs.length; i++) bs[i].addEventListener("click", function (e) { applyTheme(e.currentTarget.getAttribute("data-theme-set"), true); });
  })();

  /* poster lightbox */
  (function () {
    var btn = document.getElementById("poster-btn"), box = document.getElementById("lightbox");
    var big = document.getElementById("lightbox-img"), img = document.getElementById("poster-img");
    function close() { box.classList.remove("open"); }
    btn.addEventListener("click", function () { big.src = img.src; big.alt = img.alt; box.classList.add("open"); });
    box.addEventListener("click", close);
    document.addEventListener("keydown", function (e) { if (e.key === "Escape") close(); });
  })();

  /* ---------- start ---------- */
  render();
  platformInit().then(function () {
    if (Z) platformOpen(Z.id);
    render();
  });
})();
</script>
<script>if ("serviceWorker" in navigator && /^https?:/.test(location.protocol)) { window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); }); }</script>
