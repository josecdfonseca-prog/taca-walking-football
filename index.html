<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<title>Taça Nacional Walking Football</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Sorteio da Zona 2 da 1.ª Taça Nacional de Walking Football: clubes, jogos e cidades de cada jornada.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600&display=swap">
<style>
/* Layout: fixture-list reading. Big condensed numerals (positions, match days) in a left column, names and opponents to the right, hairline rules instead of cards. */
:root {
  --bg: #F6F6F9;
  --surface: #FFFFFF;
  --ink: #16171D;
  --muted: #5D6070;
  --line: #E1E2EA;
  --accent: #0B7F6C;
  --accent-ink: #FFFFFF;
  --accent-soft: #DDF3EE;
  --pink: #D1006F;
  --blue: #0079B4;
  --warm: #B85F00;
  --c-pink: #E50C7D;
  --c-blue: #00A0E3;
  --c-teal: #14AD96;
  --c-orange: #F29400;
  --font-display: "Barlow Condensed", "Arial Narrow", Arial, sans-serif;
  --font-body: "Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12111A;
    --surface: #1B1A26;
    --ink: #F1F1F6;
    --muted: #A3A5B8;
    --line: #2D2C3C;
    --accent: #3CCDB3;
    --accent-ink: #07211C;
    --accent-soft: #153A35;
    --pink: #FF5BAE;
    --blue: #4DBBF0;
    --warm: #FFAE3D;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12111A;
  --surface: #1B1A26;
  --ink: #F1F1F6;
  --muted: #A3A5B8;
  --line: #2D2C3C;
  --accent: #3CCDB3;
  --accent-ink: #07211C;
  --accent-soft: #153A35;
  --pink: #FF5BAE;
  --blue: #4DBBF0;
  --warm: #FFAE3D;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.4;
  padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 680px; margin: 0 auto; min-width: 0; }
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

header.top { display: grid; gap: 6px; padding-bottom: 14px; }
.eyebrow {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 15px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--pink);
}
h1 {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(34px, 9vw, 46px);
  line-height: 0.95;
  text-transform: uppercase;
  letter-spacing: 0.01em;
  margin: 0;
  text-wrap: balance;
}
nav.tabs { display: flex; gap: 22px; border-bottom: 1px solid var(--line); margin-top: 6px; }
nav.tabs a {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 20px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  text-decoration: none;
  color: var(--muted);
  padding: 10px 0 8px;
  border-bottom: 3px solid transparent;
  margin-bottom: -1px;
}
nav.tabs a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--c-pink); }

.note { color: var(--muted); font-size: 14px; margin: 12px 0 0; min-height: 1.4em; }
.note.err { color: var(--warm); }

/* Header with poster */
.stripes { display: flex; gap: 5px; height: 10px; overflow: hidden; margin: 0 0 16px; }
.stripes i { flex: 1; transform: skewX(-40deg); }
.stripes i:nth-child(1) { background: var(--c-pink); }
.stripes i:nth-child(2) { background: var(--c-blue); }
.stripes i:nth-child(3) { background: var(--c-teal); }
.stripes i:nth-child(4) { background: var(--c-orange); }
.masthead { display: grid; grid-template-columns: minmax(0, 1fr) 128px; gap: 16px; align-items: start; }
.poster-btn { display: block; padding: 0; border: 0; background: none; cursor: zoom-in; border-radius: 4px; }
.poster-btn img { display: block; width: 100%; height: auto; border-radius: 4px; box-shadow: 0 1px 0 var(--line), 0 6px 18px rgba(20, 20, 40, 0.18); }
.poster-cap { font-size: 12px; color: var(--muted); margin-top: 6px; line-height: 1.3; }
.lightbox { position: fixed; inset: 0; z-index: 50; display: none; place-items: center; background: rgba(10, 10, 20, 0.86); padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); cursor: zoom-out; }
.lightbox.open { display: grid; }
.lightbox img { max-width: 100%; max-height: 100%; width: auto; height: auto; border-radius: 4px; }
@media (max-width: 420px) { .masthead { grid-template-columns: minmax(0, 1fr) 96px; gap: 12px; } }

/* Clubs list */
ol.clubs { list-style: none; margin: 4px 0 0; padding: 0; }
ol.clubs li { border-bottom: 1px solid var(--line); }
ol.clubs a {
  display: grid;
  grid-template-columns: 64px minmax(0, 1fr) 20px;
  align-items: center;
  gap: 8px;
  padding: 11px 0;
  text-decoration: none;
}
.posnum {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 34px;
  line-height: 1;
  color: var(--pink);
  font-variant-numeric: tabular-nums;
}
.posnum small { font-size: 17px; font-weight: 600; margin-right: 2px; color: var(--muted); }
.cname { font-size: 18px; font-weight: 600; overflow-wrap: anywhere; }
.chev { color: var(--muted); }
ol.clubs a:hover .cname { text-decoration: underline; text-underline-offset: 3px; }

/* Team header */
.back { display: inline-flex; align-items: center; gap: 4px; color: var(--muted); text-decoration: none; font-size: 15px; padding: 14px 0 6px; }
.back:hover { color: var(--ink); }
.teamhead { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 14px; align-items: end; padding: 4px 0 14px; border-bottom: 3px solid var(--c-teal); }
.teamhead .posnum { font-size: 64px; }
.teamhead .posnum small { font-size: 28px; }
h2.tname {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(28px, 8vw, 38px);
  line-height: 1;
  margin: 0;
  overflow-wrap: anywhere;
  text-wrap: balance;
}
.tsub { color: var(--muted); font-size: 14px; margin-top: 4px; }

/* Fixture blocks */
.fix { display: grid; grid-template-columns: 70px minmax(0, 1fr); gap: 12px; padding: 16px 0; border-bottom: 1px solid var(--line); }
.when { display: grid; align-content: start; justify-items: start; gap: 2px; }
.when .day { font-family: var(--font-display); font-weight: 700; font-size: 40px; line-height: 0.9; font-variant-numeric: tabular-nums; }
.when .mon { font-family: var(--font-display); font-weight: 600; font-size: 15px; letter-spacing: 0.1em; color: var(--pink); }
.when .wd { font-size: 12px; color: var(--muted); }
.what { min-width: 0; display: grid; gap: 4px; }
.cityline { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; min-height: 30px; }
.cityline .label { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.cityline .cityname { font-weight: 600; font-size: 17px; }
.cityline .pending { color: var(--muted); font-style: italic; }
.jr { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }

.game { display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: 10px; align-items: baseline; padding: 7px 0; border-top: 1px dashed var(--line); }
.game:first-of-type { border-top: 0; }
.slot { font-family: var(--font-display); font-weight: 600; font-size: 15px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.slot.extra { color: var(--warm); }
a.opp { display: inline-flex; flex-wrap: wrap; gap: 2px 8px; align-items: baseline; text-decoration: none; min-width: 0; }
a.opp .p { font-family: var(--font-display); font-weight: 700; font-size: 17px; color: var(--pink); }
a.opp .n { font-weight: 600; font-size: 17px; overflow-wrap: anywhere; }
a.opp:hover .n { text-decoration: underline; text-underline-offset: 3px; }
.rest { color: var(--muted); font-style: italic; }

/* Edit controls */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  min-height: 34px; padding: 4px 12px;
  background: transparent; border: 1px solid var(--line); border-radius: 6px;
  font-size: 14px; cursor: pointer;
}
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.primary:hover { color: var(--accent-ink); filter: brightness(1.06); }
.iconbtn { min-width: 34px; padding: 4px 8px; }
form.inline { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; width: 100%; }
form.inline input {
  flex: 1 1 180px; min-width: 0; min-height: 40px;
  font: inherit; font-size: 16px; color: var(--ink);
  background: var(--surface); border: 1px solid var(--accent); border-radius: 6px; padding: 6px 10px;
}

.printbar { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 0 0; }
.btn.gps { text-decoration: none; color: var(--accent); border-color: var(--accent); }
.btn.gps:hover { background: var(--accent-soft); }

/* Calendar tab */
details.all { margin-top: 6px; }
details.all summary { cursor: pointer; color: var(--accent); font-size: 14px; font-weight: 600; padding: 6px 0; }
details.all h4 { font-family: var(--font-display); font-weight: 600; font-size: 15px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 10px 0 4px; }
ul.matches { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
ul.matches li { display: flex; flex-wrap: wrap; gap: 0 6px; align-items: baseline; font-size: 15px; padding: 3px 0; }
ul.matches .p { font-family: var(--font-display); font-weight: 700; color: var(--pink); }
ul.matches .x { color: var(--muted); }
ul.matches a { text-decoration: none; }
ul.matches a:hover { text-decoration: underline; }

@media (max-width: 380px) {
  .fix { grid-template-columns: 58px minmax(0, 1fr); gap: 10px; }
  .game { grid-template-columns: 80px minmax(0, 1fr); }
  ol.clubs a { grid-template-columns: 56px minmax(0, 1fr) 16px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
</style>
</head>

  /* ---------- persistence ---------- */
  function persist(updates) {
    if (mode === "local" || !DB_URL) {
      try { localStorage.setItem(KEY, JSON.stringify(over)); } catch (e) {}

    chain = chain.then(function () {
      return fetch(DB_URL + "/zona2.json", { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify(updates) });
    }).then(function (r) {
      if (!r.ok) throw new Error("http " + r.status);

      up["gps/" + key] = gu || null;

  function loadLocal() {

  function startLocal() {

  function applyRemote(data) {

  function pull() {
    return fetch(DB_URL + "/zona2.json").then(function (r) {
      if (!r.ok) throw new Error("http " + r.status);
      return r.json();
    }).then(function (data) {
      var before = JSON.stringify(over);
      applyRemote(data);
      if (!editing && JSON.stringify(over) !== before) render();
    });
  }
  function init() {
    if (!DB_URL) { startLocal(); return; }
    DB_URL = DB_URL.replace(/\/+$/, "");
    mode = "shared";
    canWrite = true;
    setStatus(idleNote());
    render();
    pull().catch(function () { setStatus("Não foi possível carregar as cidades guardadas.", true); });
    setInterval(function () { if (!document.hidden) pull().catch(function () {}); }, 20000);
    document.addEventListener("visibilitychange", function () { if (!document.hidden) pull().catch(function () {}); });
  }
  init();
})();
</script>
</body>
</html>
